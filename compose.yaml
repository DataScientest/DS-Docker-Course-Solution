# The complete project: the database (db), model training (train) and the API (api).
# The ${…} passwords are read from the .env file (a copy of .env.example).
name: ds-project

services:
  # MariaDB database: image built from db/Dockerfile (official image + scripts + data)
  db:
    build: ./db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ds_project
      MARIADB_USER: api
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql            # the data outlives the containers
    healthcheck:                          # "ready" = accepts connections
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Model training: a one-off job, which stops (code 0) once the model is saved
  train:
    build: ./train
    environment:
      DB_HOST: db                         # the name of the database service
      DB_PORT: 3306
      DB_USER: api
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ds_project
      MODEL_PATH: /models/knn.joblib
    volumes:
      - models:/models                    # the model is written to the shared volume
    depends_on:
      db:
        condition: service_healthy        # wait until the database is ready

  # FastAPI API: transactions and predictions
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: api
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ds_project
      MODEL_PATH: /models/knn.joblib
    volumes:
      - models:/models:ro                 # same volume, read-only: the API only reads the model
    depends_on:
      db:
        condition: service_healthy
      train:
        condition: service_completed_successfully   # wait until the model is trained

volumes:
  db_data:
  models:
