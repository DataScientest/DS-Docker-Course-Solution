# Le projet complet : la base (db), l'entraînement du modèle (train) et l'API (api).
# Les mots de passe ${…} sont lus dans le fichier .env (copie de .env.example).
name: fil-rouge

services:
  # Base MariaDB : image construite à partir de db/Dockerfile (image officielle + scripts + données)
  db:
    build: ./db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: fil_rouge
      MARIADB_USER: api
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql            # les données survivent aux conteneurs
    healthcheck:                          # « prête » = accepte les connexions
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Entraînement du modèle : un traitement ponctuel, qui s'arrête (code 0) une fois le modèle enregistré
  train:
    build: ./train
    environment:
      DB_HOST: db                         # le nom du service de la base
      DB_PORT: 3306
      DB_USER: api
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: fil_rouge
      MODEL_PATH: /models/knn.joblib
    volumes:
      - models:/models                    # le modèle est écrit dans le volume partagé
    depends_on:
      db:
        condition: service_healthy        # attendre que la base soit prête

  # API FastAPI : transactions et prédictions
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: api
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: fil_rouge
      MODEL_PATH: /models/knn.joblib
    volumes:
      - models:/models:ro                 # même volume, en lecture seule : l'API ne fait que lire le modèle
    depends_on:
      db:
        condition: service_healthy
      train:
        condition: service_completed_successfully   # attendre que le modèle soit entraîné

volumes:
  db_data:
  models:
